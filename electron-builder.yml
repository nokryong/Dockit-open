appId: com.nokryong.dockit-open
productName: Dockit Open
icon: public/logo/symbol-square.svg
fileAssociations:
  - ext: dkt
    name: Dockit Document
    role: Editor
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*.cjs
  - plugin-sdk/*.cjs
  - plugin-sdk/browser.js
  - desktop/default-settings.json
  - desktop/locales/*.json
  - docs/codex/AGENTS.md
  - scripts/build-windows-print.cjs
  - native/windows-print/Program.cs
  - native/windows-print/app.manifest
  - package.json
  - LICENSE
  - README.md
  # 화면 코드는 dist에 번들되어 있으므로 Electron 본체와 Codex 스킬 리더가 실행 중 불러오는 패키지만 포함
  # (설치 파일 용량과 파일 수 감소, 목록 검사: tests/local/packaged-dependencies.test.cjs)
  - "!node_modules/**/*"
  - "node_modules/{argparse,builder-util-runtime,debug,electron-updater,fflate,fs-extra,graceful-fs,jose,js-yaml,jsonfile,lazy-val,lodash.escaperegexp,lodash.isequal,ms,react,react-dom,react-icons,sax,scheduler,semver,tiny-typed-emitter,universalify}/**/*"
# Codex launches the skill reader in a separate Node process.
asar: false
publish:
  provider: github
  owner: nokryong
  repo: Dockit-open
  releaseType: release
  private: false
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
  icon: public/logo/symbol-square.png
