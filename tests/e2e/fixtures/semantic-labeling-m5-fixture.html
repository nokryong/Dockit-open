<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dockit semantic labeling M5 fixture</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color: #16332f;
        background: #edf5f3;
        font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 0;
      }

      button,
      input {
        font: inherit;
      }

      .m5-shell {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .m5-title {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.03em;
      }

      .m5-subtitle {
        margin: 0 0 22px;
        color: #50716c;
        font-size: 14px;
      }

      .m5-grid {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }

      .m5-card {
        min-width: 0;
        padding: 18px;
        border: 1px solid #c7ddd8;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 30px rgb(18 75 66 / 8%);
      }

      .m5-targets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 14px;
      }

      .m5-targets button {
        padding: 8px 12px;
        border: 1px solid #9fc7c0;
        border-radius: 999px;
        color: #185f55;
        background: #f4fbf9;
        cursor: pointer;
      }

      .m5-targets button[aria-pressed="true"] {
        color: #fff;
        background: #19786b;
      }

      [data-testid="semantic-attributes-editor"] {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }

      [data-testid="semantic-attributes-editor"] label {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      [data-testid="semantic-attributes-editor"] input {
        width: 100%;
        min-width: 0;
        padding: 10px 11px;
        border: 1px solid #afc8c4;
        border-radius: 10px;
        color: #183b35;
        background: #fff;
      }

      [data-testid="semantic-attributes-editor"] button {
        min-height: 34px;
        padding: 7px 10px;
        border-radius: 9px;
        cursor: pointer;
      }

      [data-testid="semantic-attributes-editor"] button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      .m5-previews {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .m5-preview-title {
        margin: 0 0 8px;
        color: #50716c;
        font-size: 12px;
        font-weight: 600;
      }

      .m5-preview-canvas {
        width: 100%;
        min-width: 0;
        min-height: 224px;
        padding: 16px;
        overflow: hidden;
        border: 1px solid #d6e5e2;
        border-radius: 14px;
        color: #183b35;
        background: #f8fbfa;
      }

      .m5-preview-canvas .shape-preview {
        display: flex;
        min-height: 172px;
        flex-direction: column;
        justify-content: center;
        padding: 22px;
        border: 1px solid #147d73;
        border-radius: 14px;
        background: #e9f8f5;
      }

      .m5-preview-canvas h1 {
        margin: 0 0 10px;
        font-size: clamp(20px, 4vw, 30px);
        line-height: 1.2;
      }

      .m5-preview-canvas p {
        margin: 0;
        color: #41645e;
        font-size: 14px;
        line-height: 1.55;
      }

      .m5-contract {
        margin: 14px 0 0;
        color: #617d78;
        font-size: 12px;
      }

      @media (max-width: 720px) {
        .m5-shell {
          width: calc(100% - 20px);
          padding-top: 14px;
        }

        .m5-title {
          font-size: 22px;
        }

        .m5-grid,
        .m5-previews {
          grid-template-columns: minmax(0, 1fr);
        }

        .m5-card {
          padding: 13px;
          border-radius: 14px;
        }

        .m5-preview-canvas {
          min-height: 190px;
          padding: 12px;
        }

        .m5-preview-canvas .shape-preview {
          min-height: 144px;
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./semantic-labeling-m5-fixture.js"></script>
  </body>
</html>
