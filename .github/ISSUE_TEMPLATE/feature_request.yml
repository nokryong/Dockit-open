name: 기능 제안 / Feature request
description: 새 기능이나 개선 아이디어를 알려 주세요. / Suggest a new feature or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요? / What problem does it solve?
      description: 지금 불편한 점이나 하고 싶은 작업을 적어 주세요. / Describe the situation or task.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 / Proposal
      description: 어떻게 동작하면 좋을지 적어 주세요. / How should it work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 다른 방법 / Alternatives
      description: 지금 쓰고 있는 우회 방법이나 다른 방안이 있다면 적어 주세요. / Workarounds or alternatives you considered.
  - type: checkboxes
    id: plugin
    attributes:
      label: 플러그인 / Plugin
      options:
        - label: 플러그인으로 만들 수 있는 기능일 수도 있습니다. / This could also work as a plugin.
